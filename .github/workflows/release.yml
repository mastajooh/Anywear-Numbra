name: Release

on:
  push:
    tags: [ '*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        run: dotnet build AnywearNumbra/AnywearNumbra.csproj -c Release

      - name: Test
        run: dotnet test AnywearNumbra.Tests/AnywearNumbra.Tests.csproj -c Release

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: AnywearNumbra
          path: AnywearNumbra/bin/x64/Release/AnywearNumbra/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item AnywearNumbra/bin/x64/Release/AnywearNumbra/latest.zip AnywearNumbra.zip
          gh release create "${{ github.ref_name }}" AnywearNumbra.zip --title "${{ github.ref_name }}" --notes "Anywear Numbra ${{ github.ref_name }}"
